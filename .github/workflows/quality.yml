name: Quality

on:
  pull_request:
    branches: [main, new-feat]
  push:
    branches: [new-feat]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Same install as desktop-release.yml: package-lock.json is written by npm 11, which must
      # run directly (see the comment there). The gate's lockfile:check also requires npm 11.
      - name: Use npm 11 (the npm that writes package-lock.json)
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@11

      - name: Install dependencies
        run: |
          $version = npm --version
          Write-Host "npm $version"
          if (-not $version.StartsWith("11.")) { throw "Expected npm 11, got $version" }
          npm ci

      - name: Run pre-release quality gate
        run: npm run verify:release
